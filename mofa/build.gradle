plugins {
    id 'com.android.application'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "it.bz.tol.mofa"
        minSdk 26
        targetSdk 36
        versionCode 42
        versionName "7.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            proguardFile 'proguard-android.txt'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
    lint {
        disable 'Typos'
        checkReleaseBuilds false
    }
    namespace 'it.schmid.android.mofa'
}

dependencies {
    implementation project(':library')
    implementation files('libs/ormlite-core-4.42.jar')
    implementation files('libs/ormlite-android-4.42.jar')
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.gson
    implementation libs.google.http.client.android
    implementation libs.dropbox.core.sdk
    implementation libs.okhttp
    implementation libs.jsoup
}
